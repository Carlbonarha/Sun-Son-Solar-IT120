<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Sun Son Solar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 48px 20px;
        }

        .content-box {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #ffd400;
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.12);
        }

        .content-box h1 {
            color: #1a73e8;
            margin-bottom: 12px;
        }

        .content-box > p {
            color: #666;
            margin-bottom: 28px;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .service-item {
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-top: 3px solid #ffd400;
            border-radius: 8px;
        }

        .service-item h2 {
            color: #1a73e8;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .service-item p {
            color: #666;
            line-height: 1.5;
        }

        @media (max-width: 620px) {
            .content-box {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">Sun Son Solar</div>
        <nav class="header-nav" aria-label="Main navigation">
            <a href="login.html">Login</a>
            <a href="register.html">Create Account</a>
            <a href="services.html">Services</a>
        </nav>
    </header>

    <main class="page-wrapper">
        <section class="content-box">
            <h1>Our Services</h1>
            <p>Explore the solar services available from Sun Son Solar.</p>
            <div class="service-list" id="servicesContainer"></div>
        </section>
    </main>

    <script src="script.js?v=4"></script>
    <script>
        const servicesContainer = document.getElementById('servicesContainer');
        getServices().forEach(service => {
            const serviceItem = document.createElement('article');
            serviceItem.className = 'service-item';
            serviceItem.innerHTML = `${service.photo ? `<img src="${service.photo}" alt="${service.name}" style="width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-bottom: 10px;">` : ''}<h2>${service.name}</h2><p>${service.description}</p>`;
            servicesContainer.appendChild(serviceItem);
        });
    </script>
</body>
</html>
