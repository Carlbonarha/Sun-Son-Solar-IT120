<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - 🌞 Sun Son Solar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-box {
            max-width: 620px;
            border-top: 5px solid #ffd400;
        }

        .form-box h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-actions .btn {
            flex: 1;
        }

        .password-heading {
            color: #1a73e8;
            margin: 24px 0 14px;
            font-size: 18px;
        }

        @media (max-width: 620px) {
            .form-row,
            .form-actions {
                grid-template-columns: 1fr;
                display: grid;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-logo">🌞 Sun Son Solar</div>
        <nav class="header-nav" aria-label="Account navigation">
            <a href="dashboard.html">Dashboard</a>
            <button class="logout-btn" type="button" onclick="logout()">Logout</button>
        </nav>
    </header>

    <main class="page-wrapper">
        <form class="form-box" id="profileForm">
            <h2>My Profile</h2>
            <p class="subtitle">Update your account and contact information.</p>
            <div id="profileAlert" class="alert" role="alert" aria-live="polite"></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input id="lastName" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input id="middleName">
                </div>
                <div class="form-group">
                    <label for="birthdate">Birthdate</label>
                    <input id="birthdate" type="date">
                </div>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="profileEmail">Email Address *</label>
                <input id="profileEmail" type="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input id="phone" type="tel">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address"></textarea>
            </div>

            <div class="form-group">
                <label for="profileUsername">Username *</label>
                <input id="profileUsername" required>
            </div>

            <h3 class="password-heading">Change Password</h3>
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input id="currentPassword" type="password" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input id="newPassword" type="password" autocomplete="new-password" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a class="btn btn-secondary text-center" href="dashboard.html">Cancel</a>
            </div>
        </form>
    </main>

    <script src="script.js?v=4"></script>
    <script>
        const profileUser = getCurrentUser();
        const profileAccount = profileUser && getAccountRecord(profileUser.id);

        if (!profileUser) {
            window.location.href = 'login.html';
        } else {
            const record = profileAccount ? profileAccount.record : {};
            document.getElementById('firstName').value = record.firstName || '';
            document.getElementById('lastName').value = record.lastName || '';
            document.getElementById('middleName').value = record.middleName || '';
            document.getElementById('birthdate').value = record.birthdate || '';
            document.getElementById('gender').value = record.gender || '';
            document.getElementById('profileEmail').value = record.email || '';
            document.getElementById('phone').value = record.phone || '';
            document.getElementById('address').value = record.address || '';
            document.getElementById('profileUsername').value = profileUser.username;
        }

        document.getElementById('profileForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('profileAlert', 'New passwords do not match', 'error');
                return;
            }

            const result = updateUserProfile({
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                middleName: document.getElementById('middleName').value.trim(),
                birthdate: document.getElementById('birthdate').value,
                gender: document.getElementById('gender').value,
                email: document.getElementById('profileEmail').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                username: document.getElementById('profileUsername').value.trim(),
                currentPassword: document.getElementById('currentPassword').value,
                newPassword: newPassword
            });

            if (!result.success) {
                showAlert('profileAlert', result.error, 'error');
                return;
            }

            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            showAlert('profileAlert', 'Profile updated successfully', 'success');
        });
    </script>
</body>
</html>
